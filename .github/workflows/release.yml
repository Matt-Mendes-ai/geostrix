name: Release

# TASKS.csv #37/#49 — builds and publishes a real GitHub Release (installer + auto-update metadata)
# whenever a version tag is pushed. Runs on windows-latest rather than this project's usual
# ubuntu-latest smoke-test runner (build.yml) for two reasons specific to a real release: (1) the NSIS
# Windows installer target needs electron-builder's winCodeSign cache, which needs the
# SeCreateSymbolicLinkPrivilege Windows only grants to an elevated/Developer-Mode session — a real
# limitation hit and documented when trying to build+publish from a local Windows dev machine without
# that privilege (see TASKS.csv #37's own notes); a hosted windows-latest runner has it. (2) the Python
# sidecar (#49) is frozen via PyInstaller, which freezes for whatever OS it runs ON — only a Windows
# runner produces the Windows .exe this project's `win.extraResources` config expects.
#
# TASKS.csv #472 — two jobs. `build` runs every third-party install script (npm ci, pip, PyInstaller
# compiled from source, electron-builder) with a READ-ONLY token that is not even left in .git/config
# (persist-credentials: false), and publishes nothing. `publish` holds the only write-capable token; it
# checks out no code and installs nothing, and only uploads the files `build` produced. Before this, the
# whole job had contents: write and checkout left the token readable, so a compromised dependency could
# push commits/tags or swap release assets — and latest.yml is the updater's only integrity check while
# the installer is unsigned (#36).
on:
  push:
    tags: ["v*"]
  # #472 — a dry run: Actions > Release > Run workflow builds and collects the files (downloadable as the
  # run's artifact) without publishing; `publish` only runs for a pushed v* tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HAS_SIGNING_CERT: ${{ secrets.WIN_CSC_LINK != '' }} # TASKS.csv #456
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # #472 — no token in .git/config for install scripts to find
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Install sidecar build deps
        working-directory: python-sidecar
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r requirements.txt -c constraints.txt
      # TASKS.csv #456 — antivirus false positives. PyInstaller's PREBUILT bootloader (in the PyPI wheel) is
      # byte-identical across countless malware samples and on many detection lists; compiling it from source
      # (MSVC is on the runner) gives GeoStrix's Python engine its own launcher. build_sidecar.js refuses to
      # build in CI if the prebuilt one is installed.
      - name: Install PyInstaller with a bootloader compiled from source
        working-directory: python-sidecar
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: venv\Scripts\python.exe -m pip install --no-binary pyinstaller pyinstaller -c constraints.txt
      # TASKS.csv #443 — never ship a build whose maths tests fail: JS logic tests, then the SimPEG
      # potential-field acceptance tests against the exact venv that gets frozen.
      - name: JS logic tests
        run: npm test
      - name: Sidecar physics tests
        working-directory: python-sidecar
        run: venv\Scripts\python.exe tests/test_potential.py
      - name: Freeze the Python sidecar
        run: npm run build:sidecar
      - name: Build the web bundle
        # BUG (v0.1.1/v0.1.2 both shipped without this): electron-builder's `files` config packages
        # dist/**/* into app.asar, but nothing had ever actually built dist/ in THIS workflow — the
        # plain `npm run build` script does `vite build && electron-builder` together, but this job
        # calls electron-builder directly (needs --win added, which build's own script doesn't take),
        # so dist/ stayed exactly whatever was gitignored-and-absent, electron-builder packaged zero
        # matching files, and the shipped app's index.html was simply missing — a genuinely blank
        # window forever, not a slow load. Caught via a real install (not just a build success check).
        run: npm run build:web
      # TASKS.csv #456 — code signing is the one thing that reliably stops antivirus/SmartScreen false
      # positives. It needs a certificate that only the project owner can obtain (see docs/antivirus.md).
      # When the repository secrets WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD exist, the Python
      # engine's executables are signed here and electron-builder signs GeoStrix.exe, the installer and the
      # uninstaller; without them the build is unchanged (unsigned).
      - name: Sign the Python engine (when a certificate is configured)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          Get-ChildItem python-sidecar\dist\geostrix-sidecar -Recurse -Include *.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WIN_CSC_KEY_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.FullName)" }
          }
          Remove-Item $pfx

      - name: "Build the installer (not published from here: #472)"
        # electron-builder still writes latest.yml with --publish never (updateInfoBuilder runs whether
        # or not it uploads). No GH_TOKEN in this job.
        run: npx electron-builder --publish never --win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Collect the release files and their SHA-256 checksums
        # The asset names electron-builder used when it uploaded itself: spaces become dashes, which is
        # also the name latest.yml points the updater at ("GeoStrix-Setup-X.exe"). #456 — SHA256SUMS lets
        # anyone (and an antivirus false-positive report) confirm a download is the exact file built here.
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $files = Get-ChildItem release -File | Where-Object { ($_.Name -like 'GeoStrix*' -and $_.Name -match '\.(exe|zip|blockmap)$') -or $_.Name -eq 'latest.yml' } # not builder-debug.yml / unpacked dirs
          foreach ($f in $files) { Copy-Item $f.FullName (Join-Path out ($f.Name -replace ' ', '-')) }
          foreach ($required in @('GeoStrix-Setup-*.exe', 'GeoStrix-Setup-*.exe.blockmap', 'latest.yml')) {
            if (-not (Get-ChildItem out -Filter $required)) { Write-Error "Build produced no file matching '$required'"; exit 1 }
          }
          $lines = Get-ChildItem out -File | Where-Object { $_.Name -match '\.(exe|zip)$' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Path out\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem out | ForEach-Object { Write-Host "$($_.Length)`t$($_.Name)" }
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # #472 — the only job with write access. No checkout, no npm/pip: nothing here runs third-party code
    # except the GitHub CLI preinstalled on the runner.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Create the GitHub release before publishing
        # TASKS.csv #36 follow-up — electron-builder starts ONE PUBLISHER PER ARTIFACT (the installer
        # and its .blockmap), and when the release doesn't exist yet both publishers independently
        # decide to create it. The logs show this plainly: "creating GitHub release  reason=release
        # doesn't exist" twice in the same run. The race has two observed failure modes, both of which
        # bit real releases here: two separate releases sharing one tag, and — more damaging — the
        # small .blockmap winning while the ~180MB installer upload is silently dropped, leaving a
        # published release with NO installer and no latest.yml, which the auto-updater then can't use.
        # electron-builder still exits 0 in that case, so CI goes green on a broken release.
        #
        # Creating the release up front removes the race entirely: both publishers then find an
        # existing release and just upload into it. Idempotent so a re-run of the same tag is safe.
        # Notes are left empty deliberately — they're filled in after the fact; --verify-tag makes this
        # fail loudly rather than inventing a tag if the ref is somehow wrong.
        run: |
          # Actions runs pwsh with $ErrorActionPreference='stop'; a `gh` probe that legitimately fails
          # (release not created yet) writes to stderr, so relax it here and branch on the exit code.
          $ErrorActionPreference = 'Continue'
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "" --verify-tag
          } else {
            Write-Host "Release ${{ github.ref_name }} already exists - uploading into it."
          }

      - name: Upload the installer, zip, blockmap, latest.yml and checksums
        # latest.yml goes LAST: an updater that reads it must find the installer it names already there.
        run: |
          $files = Get-ChildItem out -File | Where-Object { $_.Name -ne 'latest.yml' } | ForEach-Object { $_.FullName }
          gh release upload "${{ github.ref_name }}" $files --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release upload "${{ github.ref_name }}" out/latest.yml --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish the release
        # electron-builder can leave the release as a DRAFT (and a draft left behind by an earlier
        # failed run is reused by the create-step above, inheriting its draft state). A draft is
        # invisible to users, is not what /releases/latest resolves to, and so the auto-updater keeps
        # serving the PREVIOUS version's latest.yml — the release looks published in the Actions log
        # while users see nothing. Hit exactly this on v0.1.9. Force it published and flagged latest.
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

      - name: Verify the release is actually complete
        # The failure above was invisible because electron-builder exits 0 even when an asset upload is
        # dropped. Assert the three assets the auto-updater needs are really present, and that
        # latest.yml's declared size matches the installer actually attached — a mismatch there means
        # electron-updater downloads the installer and then rejects it on checksum, which is worse than
        # no release at all. Fails the job so a broken release can never go unnoticed again.
        run: |
          $rel = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets,isDraft | ConvertFrom-Json
          $assets = $rel
          $names = $rel.assets | ForEach-Object { $_.name }
          Write-Host "Assets: $($names -join ', ')"
          # A draft release is invisible to users and /releases/latest keeps resolving to the previous
          # version, so the auto-updater never offers this one. Assert it is genuinely published.
          if ($rel.isDraft) {
            Write-Error "Release is still a draft - users and the auto-updater would not see it."
            exit 1
          }
          foreach ($required in @('GeoStrix-Setup-*.exe', 'GeoStrix-Setup-*.exe.blockmap', 'latest.yml')) {
            if (-not ($names | Where-Object { $_ -like $required })) {
              Write-Error "Release is missing a required asset matching '$required'"
              exit 1
            }
          }
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern 'latest.yml' --output latest.yml --clobber
          $declared = (Select-String -Path latest.yml -Pattern '^\s*size:\s*(\d+)').Matches[0].Groups[1].Value
          $actual = ($assets.assets | Where-Object { $_.name -like 'GeoStrix-Setup-*.exe' }).size
          Write-Host "latest.yml declares size=$declared; attached installer size=$actual"
          if ($declared -ne $actual) {
            Write-Error "latest.yml size does not match the attached installer - the auto-updater would reject this download."
            exit 1
          }
          Write-Host "Release verified: installer, blockmap and latest.yml all present and consistent."
