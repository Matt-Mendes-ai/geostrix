name: Release

# TASKS.csv #37/#49 — builds and publishes a real GitHub Release (installer + auto-update metadata)
# whenever a version tag is pushed. Runs on windows-latest rather than this project's usual
# ubuntu-latest smoke-test runner (build.yml) for two reasons specific to a real release: (1) the NSIS
# Windows installer target needs electron-builder's winCodeSign cache, which needs the
# SeCreateSymbolicLinkPrivilege Windows only grants to an elevated/Developer-Mode session — a real
# limitation hit and documented when trying to build+publish from a local Windows dev machine without
# that privilege (see TASKS.csv #37's own notes); a hosted windows-latest runner has it. (2) the Python
# sidecar (#49) is frozen via PyInstaller, which freezes for whatever OS it runs ON — only a Windows
# runner produces the Windows .exe this project's `win.extraResources` config expects.
#
# GITHUB_TOKEN is the default per-workflow token GitHub provides automatically (not a manually-managed
# secret) — `permissions: contents: write` below is what lets electron-builder's --publish step use it
# to create the release and upload assets, scoped to just this repo for just this workflow run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Install sidecar build deps
        working-directory: python-sidecar
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
      - name: Freeze the Python sidecar
        run: npm run build:sidecar
      - name: Build the web bundle
        # BUG (v0.1.1/v0.1.2 both shipped without this): electron-builder's `files` config packages
        # dist/**/* into app.asar, but nothing had ever actually built dist/ in THIS workflow — the
        # plain `npm run build` script does `vite build && electron-builder` together, but this job
        # calls electron-builder directly (needs --win added, which build's own script doesn't take),
        # so dist/ stayed exactly whatever was gitignored-and-absent, electron-builder packaged zero
        # matching files, and the shipped app's index.html was simply missing — a genuinely blank
        # window forever, not a slow load. Caught via a real install (not just a build success check).
        run: npm run build:web
      - name: Create the GitHub release before publishing
        # TASKS.csv #36 follow-up — electron-builder starts ONE PUBLISHER PER ARTIFACT (the installer
        # and its .blockmap), and when the release doesn't exist yet both publishers independently
        # decide to create it. The logs show this plainly: "creating GitHub release  reason=release
        # doesn't exist" twice in the same run. The race has two observed failure modes, both of which
        # bit real releases here: two separate releases sharing one tag, and — more damaging — the
        # small .blockmap winning while the ~180MB installer upload is silently dropped, leaving a
        # published release with NO installer and no latest.yml, which the auto-updater then can't use.
        # electron-builder still exits 0 in that case, so CI goes green on a broken release.
        #
        # Creating the release up front removes the race entirely: both publishers then find an
        # existing release and just upload into it. Idempotent so a re-run of the same tag is safe.
        # Notes are left empty deliberately — they're filled in after the fact; --verify-tag makes this
        # fail loudly rather than inventing a tag if the ref is somehow wrong.
        run: |
          # Actions runs pwsh with $ErrorActionPreference='stop'; a `gh` probe that legitimately fails
          # (release not created yet) writes to stderr, so relax it here and branch on the exit code.
          $ErrorActionPreference = 'Continue'
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "" --verify-tag
          } else {
            Write-Host "Release ${{ github.ref_name }} already exists - uploading into it."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npx electron-builder --publish always --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        # electron-builder can leave the release as a DRAFT (and a draft left behind by an earlier
        # failed run is reused by the create-step above, inheriting its draft state). A draft is
        # invisible to users, is not what /releases/latest resolves to, and so the auto-updater keeps
        # serving the PREVIOUS version's latest.yml — the release looks published in the Actions log
        # while users see nothing. Hit exactly this on v0.1.9. Force it published and flagged latest.
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release is actually complete
        # The failure above was invisible because electron-builder exits 0 even when an asset upload is
        # dropped. Assert the three assets the auto-updater needs are really present, and that
        # latest.yml's declared size matches the installer actually attached — a mismatch there means
        # electron-updater downloads the installer and then rejects it on checksum, which is worse than
        # no release at all. Fails the job so a broken release can never go unnoticed again.
        run: |
          $rel = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets,isDraft | ConvertFrom-Json
          $assets = $rel
          $names = $rel.assets | ForEach-Object { $_.name }
          Write-Host "Assets: $($names -join ', ')"
          # A draft release is invisible to users and /releases/latest keeps resolving to the previous
          # version, so the auto-updater never offers this one. Assert it is genuinely published.
          if ($rel.isDraft) {
            Write-Error "Release is still a draft - users and the auto-updater would not see it."
            exit 1
          }
          foreach ($required in @('GeoStrix-Setup-*.exe', 'GeoStrix-Setup-*.exe.blockmap', 'latest.yml')) {
            if (-not ($names | Where-Object { $_ -like $required })) {
              Write-Error "Release is missing a required asset matching '$required'"
              exit 1
            }
          }
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern 'latest.yml' --output latest.yml --clobber
          $declared = (Select-String -Path latest.yml -Pattern '^\s*size:\s*(\d+)').Matches[0].Groups[1].Value
          $actual = ($assets.assets | Where-Object { $_.name -like 'GeoStrix-Setup-*.exe' }).size
          Write-Host "latest.yml declares size=$declared; attached installer size=$actual"
          if ($declared -ne $actual) {
            Write-Error "latest.yml size does not match the attached installer - the auto-updater would reject this download."
            exit 1
          }
          Write-Host "Release verified: installer, blockmap and latest.yml all present and consistent."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
