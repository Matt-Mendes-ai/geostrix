name: Sidecar tests

# TASKS.csv #471 — the Python engine's physics tests (tests/test_potential.py: forward accuracy against closed-
# form spheres, gravity sign, inversion recovery, drillhole constraints) used to run only at release time.
# Now also on any push / PR that touches python-sidecar/. Windows, like the release build that freezes it.
on:
  push:
    branches: [master]
    paths: ["python-sidecar/**", ".github/workflows/sidecar.yml"]
  pull_request:
    branches: [master]
    paths: ["python-sidecar/**", ".github/workflows/sidecar.yml"]

permissions:
  contents: read

jobs:
  potential-fields:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install the pinned engine dependencies
        working-directory: python-sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
      - name: Physics tests
        working-directory: python-sidecar
        run: python tests/test_potential.py
      - name: Fault tests (GemPy, #360)
        working-directory: python-sidecar
        run: python tests/test_implicit_faults.py
      - name: DC/IP 2D tests (#322)
        working-directory: python-sidecar
        run: python tests/test_dcip2d.py
      - name: Onlap orientation tests (#512)
        working-directory: python-sidecar
        run: python tests/test_implicit_dedupe.py
      # TASKS.csv #557 — the live API checks (token / host guards, 409, cancel, result shape) ran nowhere, and
      # nothing ran one job of each kind through the HTTP + job-process path. A server from source here; the
      # release workflow runs the same two scripts against the frozen exe.
      - name: Live engine checks (jobs API + one job of each kind)
        working-directory: python-sidecar
        run: |
          $env:GEOSTRIX_SIDECAR_TOKEN = [guid]::NewGuid().ToString("N")
          $log = Join-Path $env:RUNNER_TEMP "sidecar"
          $p = Start-Process -FilePath python -ArgumentList "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8799" -PassThru -NoNewWindow -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          $failed = $false
          try {
            python tests/smoke_jobs.py 8799 $env:GEOSTRIX_SIDECAR_TOKEN
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            if (-not $failed) {
              python tests/test_jobs_api.py 8799 $env:GEOSTRIX_SIDECAR_TOKEN
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          } finally {
            taskkill /PID $p.Id /T /F 2>&1 | Out-Null # may race a job worker that is already exiting: result ignored
            Get-Content "$log.err" -Tail 40 -ErrorAction SilentlyContinue
          }
          if ($failed) { exit 1 }
          exit 0
