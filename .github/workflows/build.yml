name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# TASKS.csv #249 (security-specialist review) — this smoke-test build never needed write access to
# anything; a public repo's default GITHUB_TOKEN permissions for a pull_request run from a fork are
# already read-only (GitHub's own safe default), so this was already correct in practice, but pinning
# it explicitly makes that self-documenting in this repo's own config instead of depending on an
# org-level setting nobody looking at this file can see.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # TASKS.csv #443 — pure-logic regression tests (intercepts, import detection, desurvey, calculator...)
      - run: npm test
      - run: npm run build:dir
      # TASKS.csv #476 — startup JavaScript must stay within its budget (it drifted 653 -> 757 kB unnoticed)
      - run: node scripts/check-bundle-size.mjs
