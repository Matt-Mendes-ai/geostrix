# TASKS.csv #638 — builds and publishes the optional predictive-modelling add-on (addons/geoml, GPL-3.0) as its own
# GitHub release, "addon-geoml-v<version>". Run by hand (Actions → "Add-on: geoML" → Run workflow). The release is never
# marked "latest": GeoStrix's own updater reads the latest release, which must stay the app's.
# Order (#663): 1. set addons/geoml/release.json "version" to server.py's ADDON_VERSION and push (the build refuses a
# mismatch, so a zip is never labelled with the previous version); 2. run this workflow; 3. copy url / sha256 / bytes /
# installedBytes / longestPath from the release's release-fields.json into release.json, so the next GeoStrix release
# knows where the add-on is and what its checksum must be. Do not cut an app release between steps 1 and 3.
name: "Add-on: geoML"

on:
  workflow_dispatch:

# TASKS.csv #663 — the shape of release.yml (#472 / #352): the job that runs pip and PyInstaller has a READ-ONLY token
# and keeps no credentials on disk, and hands the zip on as an artifact; the only job with write access runs no
# third-party code (no checkout, no pip), just the GitHub CLI preinstalled on the runner. Actions pinned to commit
# SHAs. Before this, a compromised dependency ran with a token that could edit any release of the repository,
# including the app's installer and latest.yml (the updater's only integrity check while installers are unsigned).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: release.json names the version the code says it is
        working-directory: addons/geoml
        run: |
          $rel = (Get-Content release.json | ConvertFrom-Json).version
          $code = (Select-String -Path geostrix_geoml/server.py -Pattern '^ADDON_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($rel -ne $code) { Write-Error "release.json says $rel but server.py ADDON_VERSION is $code - bump release.json first"; exit 1 }
          Write-Host "Building add-on $code"
      - name: Install the add-on's dependencies
        working-directory: addons/geoml
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: PyInstaller with a bootloader compiled here (as the main engine, #456)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller
      - name: Build and zip
        working-directory: addons/geoml
        run: python build_addon.py --out addon-out
      # TASKS.csv #694 — the BUILT program answers its API correctly (identity proof, token / Host guards, 404 / 409,
      # cancel, a bad job ends as an error) before anything is uploaded; it caught "No such job" answering 500.
      - name: API test of the built add-on
        working-directory: addons/geoml
        run: |
          $env:GEOSTRIX_ADDON_TOKEN = "ci-token-694"; $env:GEOSTRIX_ADDON_PORT = "8791"
          $p = Start-Process -FilePath "addon-out/geostrix-geoml/geostrix-geoml.exe" -PassThru -WindowStyle Hidden
          try { python tests/test_api.py 8791 ci-token-694; if ($LASTEXITCODE -ne 0) { exit 1 } }
          finally { Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: addon-files
          path: |
            addons/geoml/addon-out/*.zip
            addons/geoml/addon-out/release-fields.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-files
          path: addon
      - name: Publish the add-on release
        run: |
          $fields = Get-Content addon/release-fields.json | ConvertFrom-Json
          $tag = "addon-geoml-v$($fields.version)"
          $zip = "addon/$($fields.file)"
          if (-not (Test-Path $zip)) { Write-Error "The artifact has no $($fields.file)"; exit 1 }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $fields.sha256) { Write-Error "sha256 of the downloaded zip ($hash) differs from release-fields.json ($($fields.sha256))"; exit 1 }
          $notes = "Optional predictive-modelling add-on for GeoStrix (geoML, GPL-3.0). Installed from inside GeoStrix (3D Modelling › geoML models) — no need to download it by hand.`n`nSource: addons/geoml in this repository · geoML: https://github.com/italo-goncalves/geoML`n`nsha256: $($fields.sha256)"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Predictive modelling add-on $($fields.version)" --notes $notes --latest=false --prerelease }
          gh release upload $tag $zip addon/release-fields.json --clobber
          Write-Host "url: https://github.com/${{ github.repository }}/releases/download/$tag/$($fields.file)"
          Get-Content addon/release-fields.json
